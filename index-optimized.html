  <script src="visualizer-final.js"></script>
  <script>
    // Panel toggle functionality
    function togglePanel(panelId) {
      const panel = document.getElementById(panelId);
      if (panel) {
        panel.classList.toggle('expanded');
      }
    }

    // Initialize visualizer
    let initAttempts = 0;
    const maxInitAttempts = 3;

    function initializeApp() {
      initAttempts++;
      console.log(`🚀 Intento de inicialización ${initAttempts}/${maxInitAttempts}`);

      if (typeof GhostVisualizer === 'undefined') {
        console.error('❌ GhostVisualizer no está definido');
        if (initAttempts < maxInitAttempts) {
          setTimeout(initializeApp, 1000);
        }
        return;
      }

      try {
        if (!window.ghostVisualizer) {
          console.log('🔧 Creando instancia de GhostVisualizer...');
          window.ghostVisualizer = new GhostVisualizer();
          console.log('✅ GhostVisualizer inicializado');
        }
      } catch (error) {
        console.error('❌ Error crítico:', error);
        if (initAttempts < maxInitAttempts) {
          setTimeout(initializeApp, 2000);
        }
      }
    }

    // Start initialization when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      
      const key = e.key.toLowerCase();
      const visualizer = window.ghostVisualizer;
      
      if (!visualizer) return;

      switch(key) {
        case ' ':
          e.preventDefault();
          visualizer.togglePlay?.();
          break;
        case 's':
          visualizer.randomizeShader?.();
          break;
        case 'r':
          visualizer.randomizeModulation?.();
          break;
        case 'c':
          visualizer.takeScreenshot?.();
          break;
        case 'g':
          visualizer.toggleRecording?.();
          break;
        case 'f':
          visualizer.toggleFullscreen?.();
          break;
        case 'h':
          // Toggle all panels
          document.querySelectorAll('.collapsible-panel').forEach(panel => {
            panel.classList.toggle('expanded');
          });
          break;
      }
    });
  </script>
